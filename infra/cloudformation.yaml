AWSTemplateFormatVersion: '2010-09-09'
Description: 'Artispreneur Agent - Hermes + ROSTR AWS Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  AppDomain:
    Type: String
    Default: agent.artispreneur.com
    Description: Domain for OAuth callbacks

  BedrockModelId:
    Type: String
    Default: deepseek.v3-v1:0
    Description: Bedrock model ID for Hermes agent

Resources:
  # ============================================
  # S3 - Hub Storage
  # ============================================
  HubBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'artispreneur-agent-hub-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins:
              - !Sub 'https://${AppDomain}'
              - 'http://localhost:3000'
            MaxAge: 3000
      Tags:
        - Key: Product
          Value: artispreneur-agent
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # DynamoDB - Instance Registry
  # ============================================
  InstanceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'artispreneur-agent-instances-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user-id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Product
          Value: artispreneur-agent
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # Cognito - User Pool
  # ============================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'artispreneur-agent-users-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Product: artispreneur-agent
        Environment: !Ref Environment

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'artispreneur-agent-${Environment}'
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'artispreneur-agent-web-${Environment}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Sub 'https://${AppDomain}/api/auth/callback'
        - 'http://localhost:3000/api/auth/callback'
      LogoutURLs:
        - !Sub 'https://${AppDomain}/'
        - 'http://localhost:3000/'
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ============================================
  # IAM - Bedrock + Hub Access Role
  # ============================================
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'artispreneur-agent-execution-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
        - PolicyName: HubS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt HubBucket.Arn
                  - !Sub '${HubBucket.Arn}/*'
        - PolicyName: InstanceDynamoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt InstanceTable.Arn
                  - !Sub '${InstanceTable.Arn}/index/*'
      Tags:
        - Key: Product
          Value: artispreneur-agent
        - Key: Environment
          Value: !Ref Environment

  # ============================================
  # IAM - User for Next.js app (Vercel/EC2)
  # ============================================
  AgentAppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'artispreneur-agent-app-${Environment}'
      Policies:
        - PolicyName: AgentAppPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt HubBucket.Arn
                  - !Sub '${HubBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt InstanceTable.Arn
                  - !Sub '${InstanceTable.Arn}/index/*'
      Tags:
        - Key: Product
          Value: artispreneur-agent
        - Key: Environment
          Value: !Ref Environment

  AgentAppAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref AgentAppUser

Outputs:
  # Cognito
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  CognitoDomain:
    Description: Cognito Hosted UI Domain
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoDomain'

  # S3
  HubBucketName:
    Description: S3 Hub Bucket Name
    Value: !Ref HubBucket
    Export:
      Name: !Sub '${AWS::StackName}-HubBucket'

  # DynamoDB
  InstanceTableName:
    Description: DynamoDB Instance Table Name
    Value: !Ref InstanceTable
    Export:
      Name: !Sub '${AWS::StackName}-InstanceTable'

  # IAM
  AgentExecutionRoleArn:
    Description: IAM Role ARN for Lambda/ECS execution
    Value: !GetAtt AgentExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ExecutionRoleArn'

  AppAccessKeyId:
    Description: Access Key ID for Next.js app
    Value: !Ref AgentAppAccessKey

  AppSecretAccessKey:
    Description: Secret Access Key for Next.js app (save this securely!)
    Value: !GetAtt AgentAppAccessKey.SecretAccessKey

  # Environment variables template
  EnvTemplate:
    Description: Environment variables for .env.production
    Value: !Sub |
      # AWS Cognito
      COGNITO_USER_POOL_ID=${UserPool}
      COGNITO_CLIENT_ID=${UserPoolClient}
      COGNITO_DOMAIN=https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
      COGNITO_REGION=${AWS::Region}

      # AWS Hub (S3 + DynamoDB)
      HUB_BACKEND=s3
      S3_HUB_BUCKET=${HubBucket}
      DYNAMODB_INSTANCE_TABLE=${InstanceTable}
      AWS_REGION=${AWS::Region}

      # AWS Credentials (for Vercel/EC2)
      AWS_ACCESS_KEY_ID=${AgentAppAccessKey}
      AWS_SECRET_ACCESS_KEY=[CHECK_OUTPUTS]

      # Bedrock
      BEDROCK_MODEL_ID=${BedrockModelId}
      BEDROCK_REGION=${AWS::Region}
