<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & Tags" subtitle="Status badges and label variants" viewport="700x80" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; padding: 20px 24px; font-family: 'Inter', sans-serif; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.02em; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
</style>
</head><body>
<div class="row">
  <span class="badge" style="background:#FEE55E; color:#7A5C00;"><span class="dot" style="background:#D4AC00;"></span>Pro</span>
  <span class="badge" style="background:#FEE3E3; color:#CC0000;">New</span>
  <span class="badge" style="background:#D1FAE5; color:#065F46;"><span class="dot" style="background:#1A7F4B;"></span>Complete</span>
  <span class="badge" style="background:#F5F5F5; color:#444;">Draft</span>
  <span class="badge" style="background:#111; color:#fff;">Coming Soon</span>
  <span class="badge" style="background:#CC0000; color:#fff;">Action Required</span>
  <span class="badge" style="background:#EFF6FF; color:#1D4ED8;">In Progress</span>
  <span class="badge" style="border:1.5px solid #CC0000; color:#CC0000; background:transparent;">Pending</span>
</div>
</body></html>
