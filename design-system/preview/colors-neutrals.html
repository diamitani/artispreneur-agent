<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral Colors" subtitle="Grays and neutrals scale" viewport="700x120" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); padding: 20px; }
  .swatches { display: flex; gap: 10px; }
  .swatch { flex: 1; }
  .chip { height: 60px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #eee; }
  .name { font-size: 11px; font-weight: 600; color: #111; }
  .hex { font-size: 10px; color: #777; font-family: monospace; }
</style>
</head><body>
<div class="swatches">
  <div class="swatch"><div class="chip" style="background:#111111; border-color:#111;"></div><div class="name">Black</div><div class="hex">#111111</div></div>
  <div class="swatch"><div class="chip" style="background:#222222; border-color:#222;"></div><div class="name">Charcoal</div><div class="hex">#222222</div></div>
  <div class="swatch"><div class="chip" style="background:#444444;"></div><div class="name">Dark Gray</div><div class="hex">#444444</div></div>
  <div class="swatch"><div class="chip" style="background:#777777;"></div><div class="name">Mid Gray</div><div class="hex">#777777</div></div>
  <div class="swatch"><div class="chip" style="background:#AAAAAA;"></div><div class="name">Subtle</div><div class="hex">#AAAAAA</div></div>
  <div class="swatch"><div class="chip" style="background:#EEEEEE;"></div><div class="name">Border</div><div class="hex">#EEEEEE</div></div>
  <div class="swatch"><div class="chip" style="background:#F5F5F5;"></div><div class="name">Surface</div><div class="hex">#F5F5F5</div></div>
  <div class="swatch"><div class="chip" style="background:#FFFFFF;"></div><div class="name">White</div><div class="hex">#FFFFFF</div></div>
</div>
</body></html>
