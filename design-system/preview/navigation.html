<!DOCTYPE html>
<!-- @dsCard group="Components" name="Navigation" subtitle="Top nav, tabs, and sidebar variants" viewport="700x160" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; padding: 20px 24px; font-family: 'Inter', sans-serif; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .nav { display: flex; gap: 0; background: #fff; border: 1px solid #eee; border-radius: 8px; overflow: hidden; padding: 0; }
  .nav-item { padding: 10px 16px; font-size: 13px; font-weight: 500; color: #444; cursor: pointer; border-right: 1px solid #eee; white-space: nowrap; }
  .nav-item.active { background: #CC0000; color: #fff; font-weight: 600; }
  .nav-item:last-child { border-right: none; }
  .tabs { display: flex; gap: 0; border-bottom: 2px solid #eee; }
  .tab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: #777; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #CC0000; border-bottom-color: #CC0000; font-weight: 600; }
  .sidebar { background: #111; border-radius: 8px; padding: 12px; width: 140px; }
  .sidebar-item { padding: 8px 12px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5); border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
  .sidebar-item.active { background: rgba(204,0,0,0.3); color: #fff; }
  .sidebar-item:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
</style>
</head><body>
<div class="row">
  <div>
    <div style="font-size:10px;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em;">Top Nav</div>
    <div class="nav">
      <div class="nav-item active">Home</div>
      <div class="nav-item">Business</div>
      <div class="nav-item">Branding</div>
      <div class="nav-item">Booking</div>
      <div class="nav-item">Academy</div>
    </div>
  </div>
  <div>
    <div style="font-size:10px;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em;">Tabs</div>
    <div class="tabs">
      <div class="tab active">Overview</div>
      <div class="tab">Documents</div>
      <div class="tab">Tasks</div>
      <div class="tab">Settings</div>
    </div>
  </div>
  <div>
    <div style="font-size:10px;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em;">Sidebar</div>
    <div class="sidebar">
      <div class="sidebar-item active">Home</div>
      <div class="sidebar-item">Business Center</div>
      <div class="sidebar-item">Brand Center</div>
      <div class="sidebar-item">Booking</div>
      <div class="sidebar-item">Academy</div>
      <div class="sidebar-item">Profile</div>
    </div>
  </div>
</div>
</body></html>
