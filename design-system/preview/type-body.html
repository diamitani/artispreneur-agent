<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type Pairs" subtitle="Serif + sans-serif pairing specimens" viewport="700x130" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; padding: 20px 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 200px; }
  .label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .sample { color: #111; }
</style>
</head><body>
<div class="row">
  <div class="col">
    <div class="label">Serif — Libre Baskerville</div>
    <div class="sample" style="font-family:'Libre Baskerville',serif; font-size:22px; font-weight:700;">Bold Display</div>
    <div class="sample" style="font-family:'Libre Baskerville',serif; font-size:18px; font-weight:400; margin-top:4px;">Regular Body Text</div>
    <div class="sample" style="font-family:'Libre Baskerville',serif; font-size:16px; font-style:italic; color:#444; margin-top:4px;">Italic Emphasis</div>
  </div>
  <div class="col">
    <div class="label">Sans — Inter</div>
    <div class="sample" style="font-family:'Inter',sans-serif; font-size:20px; font-weight:700;">Bold UI Heading</div>
    <div class="sample" style="font-family:'Inter',sans-serif; font-size:15px; font-weight:500; margin-top:4px; color:#444;">Medium Subtext</div>
    <div class="sample" style="font-family:'Inter',sans-serif; font-size:13px; font-weight:400; color:#777; margin-top:4px;">Regular Caption Text</div>
  </div>
  <div class="col">
    <div class="label">Overlines &amp; Labels</div>
    <div class="sample" style="font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#CC0000; margin-top:4px;">Business Center</div>
    <div class="sample" style="font-family:'Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#777; margin-top:8px;">Step 1 of 5</div>
    <div class="sample" style="font-family:'Inter',sans-serif; font-size:11px; font-weight:500; color:#111; background:#FEE55E; padding:2px 8px; border-radius:4px; display:inline-block; margin-top:8px;">Pro</div>
  </div>
</div>
</body></html>
