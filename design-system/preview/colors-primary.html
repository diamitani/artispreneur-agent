<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary Colors" subtitle="Crimson & Gold — brand primary palette" viewport="700x140" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); padding: 20px; }
  .swatches { display: flex; gap: 12px; }
  .swatch { flex: 1; }
  .chip { height: 80px; border-radius: 8px; margin-bottom: 8px; }
  .name { font-size: 12px; font-weight: 600; color: #111; }
  .hex { font-size: 11px; color: #777; font-family: monospace; }
  .role { font-size: 10px; color: #aaa; margin-top: 2px; }
</style>
</head><body>
<div class="swatches">
  <div class="swatch">
    <div class="chip" style="background:#CC0000;"></div>
    <div class="name">Crimson</div>
    <div class="hex">#CC0000</div>
    <div class="role">Primary Brand</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#A30000;"></div>
    <div class="name">Crimson Dark</div>
    <div class="hex">#A30000</div>
    <div class="role">Hover / Pressed</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#FED001; border: 1px solid #eee;"></div>
    <div class="name">Gold</div>
    <div class="hex">#FED001</div>
    <div class="role">Accent</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#D4AC00; border: 1px solid #eee;"></div>
    <div class="name">Gold Dark</div>
    <div class="hex">#D4AC00</div>
    <div class="role">Hover / Pressed</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#FEE55E; border: 1px solid #eee;"></div>
    <div class="name">Gold Light</div>
    <div class="hex">#FEE55E</div>
    <div class="role">Background / Badges</div>
  </div>
</div>
</body></html>
