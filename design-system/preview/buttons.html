<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, outlined, ghost — all sizes" viewport="700x120" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #fff; padding: 20px 24px; font-family: 'Inter', sans-serif; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; padding: 10px 20px; font-size: 14px; text-decoration: none; }
  .btn-primary { background: #CC0000; color: #fff; }
  .btn-primary:hover { background: #A30000; }
  .btn-secondary { background: #FED001; color: #111; }
  .btn-secondary:hover { background: #D4AC00; }
  .btn-outlined { background: transparent; color: #CC0000; border: 1.5px solid #CC0000; }
  .btn-ghost { background: transparent; color: #444; }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 5px; }
  .btn-lg { padding: 14px 28px; font-size: 16px; border-radius: 8px; }
  .btn-disabled { opacity: 0.4; cursor: not-allowed; }
  .row + .row { margin-top: 10px; }
  .sep { width: 1px; height: 32px; background: #eee; }
</style>
</head><body>
<div class="row">
  <button class="btn btn-primary">Get Started</button>
  <button class="btn btn-secondary">Explore Features</button>
  <button class="btn btn-outlined">Learn More</button>
  <button class="btn btn-ghost">Cancel</button>
</div>
<div class="row">
  <button class="btn btn-primary btn-sm">Small</button>
  <button class="btn btn-primary">Default</button>
  <button class="btn btn-primary btn-lg">Large</button>
  <div class="sep"></div>
  <button class="btn btn-primary btn-disabled" disabled>Disabled</button>
  <button class="btn btn-secondary btn-disabled" disabled>Disabled</button>
</div>
</body></html>
